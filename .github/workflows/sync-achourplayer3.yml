
name: Sync Achourplayer3 into Achourplayer2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Achourplayer2
        uses: actions/checkout@v4
        with:
          ref: main
          path: target

      - name: Checkout Achourplayer3
        uses: actions/checkout@v4
        with:
          repository: saidachour35-byte/Achourplayer3
          ref: main
          path: source

      - name: Remove old source submodule
        run: |
          git -C target rm -f --cached --ignore-unmatch source || true
          rm -rf target/source
          if [ -f target/.gitmodules ]; then
            git -C target config -f .gitmodules --remove-section submodule.source || true
          fi

      - name: Sync complete project
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='android/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            source/ target/

      - name: Commit and push
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync complete project from Achourplayer3"
            git push
          fi
